name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Verificações do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Testes das verificações
        run: python -m unittest discover -s tools/ci/tests -v

      - name: Verificar repositório (LOG.md, finais de linha, LFS, arquivos proibidos)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/ci/check_repo.py --base "origin/${{ github.base_ref }}"
          else
            python tools/ci/check_repo.py
          fi

  data-validation:
    name: Validação de dados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Testes do validador
        run: python -m unittest discover -s tools/data/tests -v

      - name: Validar game/content contra schemas/
        run: python tools/data/validate_content.py

  gdscript-lint:
    name: Lint GDScript e pureza do núcleo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Pureza do núcleo (game/core sem dependência do motor)
        run: python tools/ci/check_core_purity.py

      - name: Formatação e lint (gdformat + gdlint)
        run: python tools/ci/lint_gdscript.py

  blender-pipeline:
    name: Pipeline do Blender
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Bibliotecas de sistema do Blender (modo headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1

      - name: Cache do Blender
        uses: actions/cache@v6
        with:
          path: tools/bin/blender
          key: blender-${{ runner.os }}-${{ hashFiles('tools/blender/asset_rules.json') }}

      - name: Baixar Blender (com SHA-256)
        run: python tools/blender/pipeline.py --fetch-blender

      - name: Testes do pipeline (inclui asset propositalmente inválido)
        run: python -m unittest discover -s tools/blender/tests -v

      - name: Validar, reexportar e comparar com os .glb versionados
        run: python tools/blender/pipeline.py --all --check --thumbnails

      - name: Publicar miniaturas e relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-blender
          path: reports/blender
          if-no-files-found: ignore
          retention-days: 14

  godot-tests:
    name: Testes Godot (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Testes do script de download
        run: python -m unittest discover -s tools/godot/tests -v

      - name: Cache da Godot e dos addons
        uses: actions/cache@v6
        with:
          path: |
            tools/bin/godot
            game/addons/gdUnit4
          key: godot-${{ runner.os }}-${{ hashFiles('tools/godot/toolchain.json') }}

      - name: Baixar Godot e addons (com checksum)
        run: python tools/godot/fetch_godot.py

      - name: Testes GdUnit4
        run: python tools/godot/run_tests.py

      - name: Testes do simulador
        run: python -m unittest discover -s tools/sim/tests -v

      - name: Sons provisórios iguais ao gerador
        run: python -m unittest discover -s tools/audio/tests -v

      - name: Balanceamento por simulação (metas de sim_profiles.json)
        run: python tools/sim/simulate.py

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-gdunit-e-simulacao
          path: |
            reports/gdunit
            reports/sim
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Instalar gitleaks (binário oficial com verificação de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks

      - name: Varrer histórico do Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .
